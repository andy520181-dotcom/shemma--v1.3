<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Shemma神么玛</title>

  <!-- 1. 第一步：加载 Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    // 安全配置 Tailwind - 等待 tailwind 变量就绪
    (function configureTailwind() {
      console.log('🎨 开始配置 Tailwind CSS...');

      const config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                '-apple-system',
                'BlinkMacSystemFont',
                'SF Pro Text',
                'SF Pro Display',
                'system-ui',
                'sans-serif'
              ],
            },
            colors: {
              primary: "#f4af25",
              "wechat-green": "#07C160",
              "ios-blue": "#007AFF",
              "ios-gray": "#8E8E93",
              "ios-bg": "#F2F2F7",
            },
            boxShadow: {
              'ios-card': '0 12px 60px -15px rgba(0, 0, 0, 0.06), 0 4px 12px -2px rgba(0, 0, 0, 0.02)',
              'glow': '0 0 25px rgba(244, 175, 37, 0.2)',
            },
            keyframes: {
              breathe: {
                '0%, 100%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.03)' },
              }
            },
            animation: {
              'spin-slow': 'spin 3s linear infinite',
              'breathe': 'breathe 4s ease-in-out infinite',
            }
          },
        },
      };

      // 检查 tailwind 是否已加载
      let retryCount = 0;
      const maxRetries = 25; // 最多重试 25 次（25 * 200ms = 5 秒）

      const configure = () => {
        if (typeof tailwind !== 'undefined') {
          console.log('✅ Tailwind 对象已就绪，开始配置...');
          tailwind.config = config;

          // 重要：配置完成后，标记 Tailwind 已就绪
          window.__TAILWIND_READY__ = true;
          console.log('🎉 Tailwind 配置完成，触发就绪事件');

          // 触发自定义事件，通知其他脚本 Tailwind 已就绪
          const event = new CustomEvent('tailwind:ready');
          window.dispatchEvent(event);
        } else {
          retryCount++;
          if (retryCount < maxRetries) {
            // 只在前几次重试时输出警告，避免日志过多
            if (retryCount <= 3 || retryCount % 5 === 0) {
              console.warn(`⚠️ Tailwind 对象未定义，重试中... (${retryCount}/${maxRetries})`);
            }
            setTimeout(configure, 200); // 增加重试间隔到 200ms
          } else {
            console.warn('⚠️ Tailwind CDN 加载超时，将使用降级样式');
          }
        }
      };

      // 在 iOS WebView 中增加初始延迟，给 CDN 更多加载时间
      setTimeout(configure, 500);

      // 设置超时保护：最多等待 5 秒
      setTimeout(() => {
        if (!window.__TAILWIND_READY__) {
          console.warn('⏰ Tailwind 配置超时（5秒），强制标记为就绪');
          window.__TAILWIND_READY__ = true;
          const event = new CustomEvent('tailwind:ready');
          window.dispatchEvent(event);
        }
      }, 5000);
    })();
  </script>

  <style>
    /* ========== 基础样式（始终生效） ========== */
    body {
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 0;
    }

    /* 隐藏滚动条 */
    ::-webkit-scrollbar {
      display: none;
    }

    /* 确保根元素有固定高度 */
    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #root {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      height: 100%;
      width: 100%;
    }

    /* ========== 应用加载前的占位样式 ========== */
    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: white;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    #app-loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 64px;
      height: 64px;
      border: 4px solid #E5E5E5;
      border-top-color: #f4af25;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    .loading-text {
      color: #9CA3AF;
      font-size: 14px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ========== Tailwind 加载前的降级样式 ========== */
    /* 这些样式会在 Tailwind 加载后被覆盖，但确保初始布局稳定 */

    /* Flexbox 基础 */
    .flex {
      display: flex !important;
    }

    .flex-col {
      flex-direction: column !important;
    }

    .flex-1 {
      flex: 1 1 0% !important;
    }

    .items-center {
      align-items: center !important;
    }

    .justify-center {
      justify-content: center !important;
    }

    .justify-between {
      justify-content: space-between !important;
    }

    /* 尺寸 */
    .w-full {
      width: 100% !important;
    }

    .h-full {
      height: 100% !important;
    }

    .h-screen {
      height: 100vh !important;
    }

    .min-h-screen {
      min-height: 100vh !important;
    }

    /* 背景和文字 */
    .bg-white {
      background-color: #ffffff !important;
    }

    .text-center {
      text-align: center !important;
    }

    /* 定位 */
    .relative {
      position: relative !important;
    }

    .absolute {
      position: absolute !important;
    }

    .fixed {
      position: fixed !important;
    }

    /* 溢出 */
    .overflow-hidden {
      overflow: hidden !important;
    }

    /* 关键尺寸保护 */
    .min-h-\[600px\] {
      min-height: 600px !important;
    }

    .h-\[32px\] {
      height: 32px !important;
    }

    .w-\[350px\] {
      width: 350px !important;
    }

    .h-\[350px\] {
      height: 350px !important;
    }

    .w-\[93\%\] {
      width: 93% !important;
    }

    .h-\[93\%\] {
      height: 93% !important;
    }

    /* 防止头像区域在加载时塌陷 */
    .min-h-0 {
      min-height: 0 !important;
    }

    /* 确保圆形元素的样式 */
    .rounded-full {
      border-radius: 9999px !important;
    }

    /* 间距保护 */
    .px-8 {
      padding-left: 2rem !important;
      padding-right: 2rem !important;
    }

    .pb-2 {
      padding-bottom: 0.5rem !important;
    }

    .mb-4 {
      margin-bottom: 1rem !important;
    }

    .gap-3 {
      gap: 0.75rem !important;
    }

    /* 文本和颜色降级 */
    .text-gray-400 {
      color: #9ca3af !important;
    }

    .bg-gray-50 {
      background-color: #f9fafb !important;
    }

    /* 交互 */
    .cursor-pointer {
      cursor: pointer !important;
    }

    /* 过渡效果 */
    .opacity-0 {
      opacity: 0 !important;
    }

    .opacity-100 {
      opacity: 1 !important;
    }

    .transition-opacity {
      transition-property: opacity !important;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1) !important;
      transition-duration: 150ms !important;
    }

    .duration-300 {
      transition-duration: 300ms !important;
    }
  </style>

  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "html2canvas": "https://esm.sh/html2canvas@1.4.1"
  }
}
  </script>
</head>

<body class="bg-white text-[#1C1C1E]">
  <!-- 加载占位符 -->
  <div id="app-loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">加载中...</div>
  </div>

  <div id="root"></div>

  <script type="module">
    // 等待 Tailwind 和 DOM 都准备好后再启动应用
    let tailwindReady = window.__TAILWIND_READY__ || false;
    let domReady = false;

    // 监听 Tailwind 就绪事件
    window.addEventListener('tailwind:ready', () => {
      console.log('📦 Tailwind 就绪事件触发');
      tailwindReady = true;
      tryStartApp();
    });

    // 监听 DOM 就绪
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        console.log('📄 DOM 已就绪');
        domReady = true;
        tryStartApp();
      });
    } else {
      domReady = true;
      tryStartApp();
    }

    // 如果 Tailwind 已经就绪（配置脚本先执行完了）
    if (window.__TAILWIND_READY__) {
      tailwindReady = true;
      tryStartApp();
    }

    function tryStartApp() {
      if (tailwindReady && domReady) {
        console.log('🚀 应用准备启动...');

        // 延迟一点点，确保样式完全应用
        setTimeout(() => {
          // 隐藏加载占位符
          const loading = document.getElementById('app-loading');
          if (loading) {
            loading.classList.add('fade-out');
            setTimeout(() => loading.remove(), 300);
          }

          // 加载应用主脚本
          import('/index.tsx').then(() => {
            console.log('✨ 应用启动完成');
          }).catch(err => {
            console.error('❌ 应用启动失败:', err);
          });
        }, 100);
      }
    }
  </script>
</body>

</html>
